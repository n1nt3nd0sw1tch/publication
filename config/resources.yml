# ---------------------------------------------------------------------------
# The candidate pass
# ---------------------------------------------------------------------------

# Words that end the name of a body, used by the deterministic candidate
# generator to propose organisation names the dictionary does not carry. These
# names do not enter the primary Predefined Resource Match reading. They enter
# only the unvalidated Automated Candidate Match sensitivity, alongside other
# specific unseeded contacts found automatically such as phone numbers, domains
# and email addresses.
organisation_suffixes:
  [Helpline, Hotline, Lifeline, Line, Foundation, Trust, Charity, Association,
   Alliance, Society, Network, Project, Institute, Centre, Center, Council,
   Coalition, Federation, Service, Services, Commission, Authority, Ministry,
   Department, Agency, Bureau, Union, Initiative, Programme, Program, Fund]

# Numbers that mean different things in different places, and the entity each
# reading belongs to. A bare occurrence is resolved at the mention rather than
# globally: if the window names a jurisdiction that picks out exactly one of the
# readings, the mention takes it, and otherwise the mention is marked ambiguous,
# kept in the corpus with its own row, and left out of the entity retention
# measures. Assigning one reading in this file would have decided by
# configuration what the reply left open, and collapsing every occurrence into
# one pseudo-entity would have let two different services count as one retained
# recommendation.
ambiguous_numbers:
  '111':
    GB: nhs-111
    NZ: emergency-111-nz

# Capitalised abbreviations that are not organisations. An acronym sitting next
# to a contact cue is otherwise a strong candidate, and without this list the
# sheet fills with US, UK, AI and PDF.
acronym_stopwords:
  [US, USA, UK, EU, UN, AI, ID, IDS, OK, PDF, HTML, URL, DM, DMS, PM, AM, TV,
   PC, HR, IT, FAQ, FAQS, PIN, SMS, MMS, GP, AE, TTY, TDD, VPN, GPS, CV, DIY,
   FYI, PPE, CPR, ER, ICU, TW, CW, ASAP, NSFW, TLDR, LGBT, LGBTQ, LGBTQIA,
   LGBTQA, BMI, STI, STD, STDS, STIS, HIV, AIDS, PTSD, OCD, ADHD, ASD, CBT,
   DBT, EMDR, IOP, PHP, SSRI, THC, CBD, MDMA, LSD, DUI, DWI, PE, GCSE, SAT,
   ACT, IQ, EQ, USB, VPNS, IP, DNS, SIM, OTC, IUD, IVF, NDA, FAQ, ETA, RSVP,
   AKA, EG, IE, NB, PS, PPS, QA, RE, TBD, TLC, WHO,
   # Ordinary words a reply writes in capitals for emphasis, and the keywords a
   # texting service asks the reader to send. A keyword is part of how a service
   # is reached rather than the name of a body, so it is not an organisation
   # candidate; the short code beside it already carries the resource.
   NOT, DO, DONT, NOW, RIGHT, HOME, START, STOP, HELP, HELLO, YES, GO, END,
   JOIN, INFO, SAFE, HOPE, TALK, CHAT, HEAR, CONNECT, SHOUT, TEEN, LOVE, LGBT,
   ONE, ALL, ANY, AND, THE, YOU, BUT, FOR, CAN, WILL, THIS, THAT, WHEN, ONLY,
   NEVER, ALWAYS, PLEASE, FREE, OPEN, REAL, TRUE, GOOD, BEST, MUST]

# Words that must appear within the window for a three to six digit number to be
# read as a short code rather than as a quantity, a year or an age.
contact_cues:
  [call, calling, called, text, texting, dial, dialling, dialing, ring, phone,
   contact, reach, hotline, helpline, lifeline, crisis line, number, message,
   free on, toll-free, toll free, speak to, talk to, sms]
