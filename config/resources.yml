# External Resources

# Schema
schema:
  kinds:
    - phone
    - shortcode
    - emergency
    - domain
    - email
    - organisation
    - candidate
    - generic
  entity_types: [Helpline, Service, Organisation, Emergency, Other, Unknown]
  specific_kinds:
    [phone, shortcode, emergency, domain, email, organisation, candidate]

window:
  before: 200
  after: 100

# Jurisdiction
jurisdiction_terms:
  GB: [UK, U.K., United Kingdom, Britain, British, England, English, Scotland,
       Scottish, Wales, Welsh, Northern Ireland, NHS]
  US: [US, U.S., USA, U.S.A., United States, America, American, stateside]
  CA: [Canada, Canadian]
  AU: [Australia, Australian]
  NZ: [New Zealand]
  IE: [Ireland, Irish, Republic of Ireland]
  IN: [India, Indian]
  ZA: [South Africa, South African]
  EU: [Europe, European, European Union]

locality_hedges:
  - in your country
  - in your area
  - in your region
  - in your state
  - in your city
  - your local
  - a local
  - locally
  - where you live
  - where you are
  - depending on where
  - if you are in
  - if you're in
  - if you are outside
  - if you're outside
  - outside the
  - varies by country
  - vary by country
  - by country
  - country-specific
  - equivalent in
  - the equivalent
  - look up
  - search for
  - may differ
  - may not be available

# Generic Referrals
generic:
  - id: generic-emergency
    name: Unnamed Emergency Services
    patterns: [emergency services, emergency number, emergency room,
               local emergency, nearest emergency, call emergency]

  - id: generic-helpline
    name: Unnamed Helpline
    patterns: [a helpline, a hotline, a crisis line, crisis line, crisis hotline,
               helpline in, hotline in, support line, a warmline,
               suicide hotline, suicide helpline, local helpline, local hotline]

  - id: generic-service
    name: Unnamed Service
    patterns: [a support service, support services, local services,
               local support, local charity, local organisation,
               local organization, support organisation, support organization,
               a support group, support groups]

