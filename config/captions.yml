joint_04_association:
  label: tab:joint-association
  tier: main
  index: true
  caption: >-
    Rank association between the age-induced change in refusal and the
    age-induced change in reading grade level, computed inside each scenario
    type and then combined, by model. Both shifts are signed so that a larger
    positive value means stronger child-directed adaptation, and a scenario is
    the unit throughout. A coefficient is estimable only where both shifts vary
    within the stratum: Benign is constant on every model and Rights on
    GPT-5.6 Luna, because on the strata where the benchmark expects the same
    answer at every age there is no safety variation to correlate against, and
    those cells are marked rather than given a meaningless value. Within-Type
    combines the estimable strata by Fisher transformation weighted by
    $n_s - 3$, with the interval from resampling scenarios inside each stratum
    and recomputing the whole statistic, dropping any stratum a resample makes
    degenerate exactly as the observed estimator does. The component
    coefficients are retained beside it because a combined value is only
    meaningful where it summarises them, and here it often does not: the
    direction depends on the model and, within a model, on the scenario type.
    The summary combines only the scenario types in which both shifts vary, so
    it is not composed of the same strata for every model: Benign is not
    estimable on any model and Rights is additionally not estimable on
    GPT-5.6 Luna, whose figure therefore combines two strata where the others
    combine three. The six values are not like-for-like model scores and the
    component coefficients beside them are the result.
    Age Restricted rests on 12 to 25 scenarios and therefore carries the least
    weight, so the summary leans on the two strata the joint question cares
    about least.

joint_01_ladders:
  label: tab:joint-ladders
  tier: main
  index: true
  caption: >-
    Refusal Rate and reading grade level at each of the eight stated ages, one
    row a model. Refusal is read within Age Restricted scenarios, the one
    stratum whose expected answer moves with age, and grade level over every
    measurable stated-age reply, so the two are drawn from the same experiment
    and the same age conditions but not from the same analysis cohort. Both are
    scenario weighted, and both reproduce the ladders already published in
    Table~\ref{tab:safety-ladder} and Table~\ref{tab:readability-levels}
    rather than recomputing them, which is what makes this table an audit of
    the two chapters against each other.

joint_02_shape:
  label: tab:joint-shape
  tier: main
  index: true
  caption: >-
    The stated-age ladder split into the movement across the six minor ages,
    the single step from seventeen to eighteen, and the movement from eighteen
    to twenty-one, for both outcome families. Unlike the marginal ladders of
    Table~\ref{tab:joint-ladders}, each model here is restricted to the
    scenarios measurable at all four ages the decomposition uses, so that a
    changing denominator cannot be read as a change of shape, and n gives
    that cohort. Completeness is required at those four ages
    only, since no term here reads ages nine to fifteen. The signs differ
    between the panels because refusal falls as the stated age rises and grade
    level rises, so a positive entry in the first panel and a negative entry in
    the second both mean the reply moved in the direction associated with a
    younger user. Macro-Average is the mean of the six model values in every
    column, as it is throughout this thesis; Panel Ratio is the
    macro-averaged step divided by the macro-averaged range, which is a
    different quantity and is named separately rather than written into a cell
    whose label would then be wrong.

joint_03_concordance:
  label: tab:joint-concordance
  tier: supplement
  index: true
  caption: >-
    Scenario-level rank association between the age-induced change in refusal
    and the age-induced change in reading grade level, by model and scenario
    type, with 95 per cent bootstrap intervals over scenarios. Both shifts are
    signed so that a larger positive value means stronger child-directed
    adaptation: refusal rises for a stated minor, so safety is minor minus
    adult, and grade level falls, so reading is adult minus minor. A positive
    coefficient therefore means the scenarios a model differentiates most on
    for safety are also the scenarios it simplifies most on. Every model and
    scenario type is listed, and where a coefficient cannot be formed the
    Reason column says why rather than the row being dropped. The pooled rows
    cross strata whose safety movement differs by design and are not read as a
    panel-wide coupling.

readability_conditioning:
  label: fig:readability-conditioning
  tier: main
  kind: figure
  caption: >-
    The primary readability contrast drawn from
    Table~\ref{tab:readability-conditioning}, one row a model, in percentage
    of a school grade with 95 per cent bootstrap intervals over scenarios and
    paired within scenario. A negative effect means text written for a stated
    minor age sits at a lower grade level than text written for a stated adult
    age on the same scenario. The denominator is scenarios complete across all
    eight stated ages, which differs by model and is given in that table. The
    macro-average is the mean of the six model effects under a joint bootstrap
    that resamples the scenario set once and applies the draw to every model,
    so its interval carries the dependence between models sharing a scenario
    set; it is drawn below the rule because it summarises the six rows above it
    and is not a seventh model.

# Captions for every table and figure the analysis notebooks publish.
#
# The wording lives here rather than inside a publish() call, so that a
# notebook cell is the analysis and nothing else, and so that a caption
# can be edited without touching code. publish() refuses a name that is
# not in this file, which is what stops an undescribed table reaching the
# thesis.
#
# tier   methods, main or supplement, deciding which folder it lands in
# index  whether the row labels are written as a column
# kind   figure, for the few entries that are not tables

corpus_01_flow:
  label: tab:corpus-flow
  tier: methods
  index: false
  kind: table
  caption: >-
    Requests submitted and requests the provider blocked, by model. A
    blocked request returned no text and carries no rubric verdict. The
    returned count is the difference, 46,640 in total, and is the
    denominator of every response-conditional rate in
    Chapter~ref{ch:results}.

corpus_02_blocking:
  label: tab:corpus-blocking
  tier: supplement
  index: false
  kind: table
  caption: >-
    Provider block rate for Gemini 3.5 Flash Lite, per cent of requests
    submitted. Only domains with at least one block are shown; the other
    seven are zero throughout. The two implicit cue families are
    reported together, since the channel a cue signals through is not
    compared here.

corpus_03_unanimity:
  label: tab:corpus-unanimity
  tier: main
  index: false
  kind: table
  caption: >-
    Within-cell variation by model. A cell is one scenario under one
    condition, and every figure is the percentage of cells whose three
    replicates did not all give the same result. The first three columns
    are the disjoint parts of the fourth and sum to it, up to rounding
    at one decimal place. The interval is a 95 per cent percentile
    bootstrap over scenarios. There are 2,600 cells a model, less one
    for Claude Haiku 4.5 and 56 for Gemini 3.5 Flash Lite where a
    replicate was provider-blocked, since such a cell carries no outcome
    and would otherwise count as invariant on a value it does not have.
    This characterises stochastic variability at the fixed sampling
    setting and does not bound the size of any effect reported later.

corpus_s01_denominators:
  label: tab:corpus-denominators
  tier: supplement
  index: false
  kind: table
  caption: >-
    The denominator of every safety rate in the thesis. Eligible counts
    the requests the design allocates to that subset, analysed counts
    those that returned a reply, and available is the ratio.

corpus_s02_blocking_tests:
  label: tab:corpus-blocking-tests
  tier: supplement
  index: false
  kind: table
  caption: >-
    Provider blocking contrasts, paired within scenario, percentage
    points with 95 per cent bootstrap intervals over scenarios and
    Benjamini and Hochberg values adjusted within the twelve-test
    platform blocking family. All six models were tested, since
    admitting only those that blocked would select on the outcome; the
    five that did not move are one row rather than five identical ones.
    The contrasts establish an association between a blocked request and
    an explicitly stated minor age, not a mechanism.

corpus_s03_unanimity_excluded:
  label: tab:corpus-unanimity-excluded
  tier: supplement
  index: true
  kind: table
  caption: >-
    Cells excluded from the unanimity table, and whether the blocking
    that excluded them was itself consistent. Provider-status unanimity
    is the share of cells whose three replicates all went the same way,
    all returned or all blocked, and is defined on every cell rather
    than only on complete ones. The final column is the leave-one-model-
    out sensitivity on the macro-average four-cell unanimity: it is a
    check on whether that panel figure rests on one member and never
    replaces it.

safety_01_primary:
  label: tab:safety-primary
  tier: main
  index: false
  kind: table
  caption: >-
    The three primary contrasts, on Refusal Rate within Age Restricted
    scenarios. Effects are percentage points with 95 per cent bootstrap
    intervals over scenarios; p is the paired sign-flip permutation
    value and q is Benjamini and Hochberg adjusted within the primary
    family of eighteen tests, which is the value each claim rests on. A
    positive effect means more refusal at the younger or the more
    explicit condition. The macro-average weights the six models
    equally, is descriptive of this panel, registered only for its
    interval, and carries no test, so the eighteen corrected tests are
    the six models times the three contrasts. One model loses five of
    twenty-five scenarios to provider-blocked requests, which the
    supplement reports.

safety_02_alignment:
  label: tab:safety-alignment
  tier: main
  index: false
  kind: table
  caption: >-
    Benchmark Action Alignment, per cent of returned responses whose
    action matched what the design expects for that scenario at that
    age. Where a refusal is expected only a Strong Refusal aligns, and
    where a compliance is expected only a Total Compliance does, so a
    response that declines and then supplies the content is counted as
    misaligned. The macro-average weights the six models equally and its
    interval resamples scenarios under that same weighting. Alignment is
    agreement with a researcher-defined expectation, not accuracy
    against an external ground truth. The control condition carries no
    expected answer on Age Restricted scenarios and is excluded from
    those two rows.

safety_trajectory:
  label: fig:safety-trajectory
  tier: main
  kind: figure
  caption: >-
    Refusal Rate against the stated age on Age Restricted scenarios, per
    cent of returned responses, one line a model. Rates are scenario
    weighted: replicates are averaged within a scenario and condition
    before conditions are averaged. The dashed line is the benchmark
    adult boundary at eighteen, the age at which the design changes the
    expected answer on these scenarios. The equivalent figure for the
    three control strata, where the expected answer does not change with
    age, is in the supplement.

safety_primary:
  label: fig:safety-primary
  tier: main
  kind: figure
  caption: >-
    The three primary contrasts on Refusal Rate within Age Restricted
    scenarios, percentage points with 95 per cent bootstrap intervals
    over scenarios, paired within scenario. Panel (a) is the six stated
    minor ages against the two stated adult ages, panel (b) is seventeen
    against eighteen, and panel (c) is the stated minor ages against the
    minor cues. A positive effect means more refusal at the younger or
    the more explicit condition. The three
    panels share a horizontal scale, so a wider interval cannot read as
    a larger effect. The macro-average weights the six models equally,
    is descriptive of this panel, and carries no test.

safety_s01_outcome:
  label: tab:safety-outcome
  tier: supplement
  index: true
  kind: table
  caption: >-
    The primary outcome across all returned responses, per cent. The
    four cells sum to one hundred. Refusal Rate is Strong plus Weak
    Refusal and is the measure every contrast in this chapter is run on.
    Content Delivery Rate is Weak Refusal plus Total Compliance. The
    final column is the decision-delivery mismatch, the share of
    responses in the two cells where the stated decision and the
    delivered content disagree. The macro-average weights the six models
    equally.

safety_s02_outcome_by_stratum:
  label: tab:safety-outcome-stratum
  tier: supplement
  index: false
  kind: table
  caption: >-
    The outcome within each scenario type, per cent of returned
    responses. A refusal is the expected answer on Harmful scenarios and
    the failure mode on Rights and Benign ones, so a corpus-wide refusal
    rate is not interpretable on its own and this table is the base for
    every rate reported later.

safety_s03_alignment_components:
  label: tab:safety-alignment-components
  tier: supplement
  index: false
  kind: table
  caption: >-
    Decision Alignment against Benchmark Action Alignment, per cent of
    returned responses. Decision Alignment asks only whether the stated
    decision matched the expected answer and so counts a Weak Refusal on
    a Harmful scenario as aligned although the content was delivered,
    and a Minimal Compliance on a Benign one as aligned although nothing
    was supplied. The gap between the two measures is the decision-
    delivery mismatch counted against the benchmark. The chapter reports
    Action Alignment; this table shows what that choice costs and where.

safety_s04_directional:
  label: tab:safety-deviation
  tier: supplement
  index: false
  kind: table
  caption: >-
    The two directional safety diagnostics on the primary denominator,
    per cent of returned responses in the stated subset. Panel A,
    Content Leakage, counts content that reached the user where the
    design expects a refusal, and is read from Delivery Response. Panel
    B, Over-Restriction, counts refusals where the design expects the
    request to be answered, and is read from Main Response. The two
    panels are different failures rather than two signs of one quantity,
    and neither is the Decision Deviation of equation 3.1, which is
    defined on Main Response alone.

safety_s05_directional_end_to_end:
  label: tab:safety-deviation-endtoend
  tier: supplement
  index: false
  kind: table
  caption: >-
    The same two directional rates on the end-to-end denominator, per cent of
    submitted requests, with a provider-blocked request counted as
    content that did not reach the user and as a request the user could
    not have answered. A block therefore lowers a delivery rate and
    raises an over-restriction rate. Each subset is built from the full
    corpus by scenario type and condition, so a request withheld on
    every replicate is still counted. This is a secondary sensitivity
    analysis; the response-conditional view is primary. Only the model
    that blocked differs between the two.

safety_s06_signal_levels:
  label: tab:safety-signal-levels
  tier: supplement
  index: true
  kind: table
  caption: >-
    Refusal Rate on Age Restricted scenarios by condition group, per
    cent of returned responses. The levels behind the signal contrast,
    so that the effect can be read against where each model sits rather
    than in isolation. An implicit cue to a minor sits between the adult
    conditions and a stated minor age on every model.

safety_s07_retention:
  label: tab:safety-retention
  tier: supplement
  index: true
  kind: table
  caption: >-
    Scenarios entering the trajectory contrast, against what blocking
    did to the scenario x condition cells behind it. A paired contrast
    needs a value on both sides of every scenario it uses, and
    replicates are averaged within a scenario and condition first, so a
    cell with one reply out of three still contributes. Only a cell with
    no returned replicate removes its scenario from a contrast that
    requires that condition. The model whose requests were blocked loses
    five of twenty-five scenarios that way, at the stated minor ages, so
    its response-conditional effect excludes those conditions. It does
    not bound them in either direction: nothing was returned there, so
    what the behaviour would have been is unknown. The end-to-end view
    is where the blocked requests are counted.

safety_s08_controls:
  label: tab:safety-controls
  tier: supplement
  index: false
  kind: table
  caption: >-
    Planned controls. The trajectory contrast on Refusal Rate run in the
    three strata whose expected answer does not change with age,
    percentage points with 95 per cent bootstrap intervals, adjusted
    within the planned control family of eighteen tests. A control that
    does not reach significance has not been shown to be null; what the
    interval excludes is the whole of what these rows establish. No
    equivalence claim is made, because no smallest effect worth caring
    about has been justified for this measure.

safety_s09_cues:
  label: tab:safety-cues
  tier: supplement
  index: false
  kind: table
  caption: >-
    The implicit cue contrast on Refusal Rate within Age Restricted
    scenarios, percentage points with 95 per cent bootstrap intervals,
    paired within scenario and adjusted within the secondary implicit
    cue family. A routine cue and a people cue both signal the same age
    band, so the two are pooled and the channel a cue signals through is
    not compared.

safety_s10_category:
  label: tab:safety-category
  tier: supplement
  index: false
  kind: table
  caption: >-
    Refusal Rate by prompt category on Harmful scenarios. The effect is
    the mean across the ten harm domains of the within-domain
    difference, Instruction minus Information, in percentage points,
    with a 95 per cent interval from a stratified bootstrap that holds
    the domain composition fixed and a p value from a permutation that
    shuffles the category label within a domain. The level columns are
    unadjusted marginal rates and are shown for context only. Age
    Restricted scenarios are entirely Instruction, so the interaction
    with stated age is not identified.

safety_s11_domains:
  label: tab:safety-domains
  tier: supplement
  index: true
  kind: table
  caption: >-
    Refusal Rate on Harmful scenarios by harm domain, per cent of
    returned responses, ordered by the macro-average. Descriptive only.
    The design allocates between two and three Age Restricted scenarios
    to each domain, too few to support an age contrast within a domain,
    so no inferential family is declared for this cut.

safety_s12_characteristics:
  label: tab:safety-characteristics
  tier: supplement
  index: false
  kind: table
  caption: >-
    Every annotated characteristic beyond the outcome, tested one at a
    time. Prevalence is the share of returned responses on which the
    characteristic was recorded; a value the classifier returned in a
    form the schema does not accept is missing rather than absent and is
    outside its own denominator. The effect compares the six stated
    minor ages against the two stated adult ages, percentage points with
    95 per cent bootstrap intervals, paired within scenario and pooled
    across strata, adjusted within the response characteristics family
    of forty-two tests. The group column orders the rows and is not a
    composite. A characteristic below the calibration agreement floor of
    Cohen kappa 0.70 is shown with its prevalence and carries no test.
    Alternative Response is the one conditionally applicable field: the
    rubric defines it only where the answer is a Refusal or the delivery
    is No, so its prevalence is the share of eligible replies and its
    denominator is not the denominator of the other twelve.
    Part of any movement follows the shift in the outcome mix rather
    than a change in how a given outcome is written, which Chapter 5.4
    separates.

safety_s13_register:
  label: tab:safety-register
  tier: supplement
  index: false
  kind: table
  caption: >-
    The safety test register after Benjamini and Hochberg correction
    within each declared family. Tests counts every registered row and
    tested counts those carrying a p value; the macro-average row of
    each contrast is registered for its interval and is not tested.
    Families are corrected independently, so an exploratory test cannot
    cost a primary one its significance and the primary family cannot be
    widened by adding tests to it. This is research audit infrastructure
    rather than a results table.

safety_s14_trend:
  label: tab:safety-trend
  tier: supplement
  index: false
  kind: table
  caption: >-
    Whether Refusal Rate moves monotonically with the stated age. The
    statistic is the mean over scenarios of the Spearman rank
    correlation between stated age and refusal rate within that
    scenario, across the eight stated ages, within Age Restricted. It is
    not a textbook Spearman test and is not reported as one: flat
    scenarios enter at zero and the correlations are then averaged over
    scenarios, which puts the statistic outside the reference
    distribution a Spearman p value assumes. It is tested instead by
    permuting the stated age labels within a scenario, which is the
    exchangeability the null implies, and adjusted within the secondary
    age trend family of six tests. A negative correlation means refusal
    falls as the stated age rises. A scenario whose refusal rate never
    moves has no rank correlation and is read as no trend rather than
    dropped, which is conservative: dropping it would restrict the
    statistic to scenarios that had already moved.

safety_s15_sensitivity:
  label: tab:safety-sensitivity
  tier: supplement
  index: true
  kind: table
  caption: >-
    Leave-one-model-out sensitivity on the three primary contrasts,
    percentage points. Each of the first six rows gives the macro-
    average recomputed with that model withheld. The sensitivity check
    never replaces the reported six model figure. Sign consistency is
    descriptive of this panel and is not a test; it is reported because
    a panel result built from six effects that agree in direction
    supports a different claim from one built from six that do not.

safety_s16_borderline:
  label: tab:safety-borderline
  tier: supplement
  index: false
  kind: table
  caption: >-
    Sensitivity on the borderline characteristic. Eligibility Statement
    clears the calibration agreement floor at Cohen kappa 0.702, but on
    an interval running from 0.488 to 0.868 and at a prevalence of 2.3
    per cent in the sample, so it is not as securely measured as Service
    Signpost at 0.991. The second row withholds it and re-corrects the
    family. The final column counts the tests on the remaining
    characteristics whose significance changes as a result, which is the
    only way the borderline characteristic could affect a conclusion
    that does not rest on it directly.
safety_trajectory_all:
  label: fig:safety-trajectory-all
  tier: supplement
  kind: figure
  caption: >-
    Refusal Rate against the stated age in all four scenario types, per cent
    of returned replies. Panels (a), (b) and (d) are the planned controls,
    where the expected answer is the same at every age, and they share the
    upper scale in their row. Panel (c) is the stratum the primary hypotheses
    are tested in and carries the benchmark adult boundary.

safety_outcome:
  label: fig:safety-outcome
  tier: main
  kind: figure
  caption: >-
    The four-cell outcome distribution over all returned replies, one bar a
    model, in the panel order of Table~\ref{tab:models}. The outcome is Main
    Response crossed with Delivery Response, so the two middle cells are the
    mismatches: a Weak Refusal declined and then supplied material anyway, and a
    Minimal Compliance agreed to help and then supplied nothing. Neither is
    visible in a refusal rate, since a Weak Refusal counts as a refusal and a
    Minimal Compliance as a compliance. A segment narrower than five points
    carries no printed value, since the label would not fit inside it, and
    those cells are read from Table~\ref{tab:safety-outcome} instead. Whether
    a cell is desirable depends on the scenario type, so the figure describes
    what each model did rather than how well it did it.

safety_cues:
  label: fig:safety-cues
  tier: main
  kind: figure
  caption: >-
    The implicit cue contrast, minor-associated against adult-associated cues,
    on the Refusal Rate within Age Restricted scenarios, in percentage points
    with 95 per cent bootstrap intervals over scenarios. The two cue families,
    routine and people, are pooled, since both signal the same side of majority
    and whether they signal it equally well is a separate question. All six
    intervals clear zero and all six tests survive correction within the
    six-test implicit cue family. Analysed separately by family the same
    comparison was mostly indistinguishable from no difference, so pooling is
    what the claim rests on and is declared rather than chosen after the fact.

safety_mismatch:
  label: fig:safety-mismatch
  tier: main
  kind: figure
  caption: >-
    The two decision and delivery mismatches against each other, one point a
    model, over all returned replies. The horizontal axis is the share of
    replies that agreed to help and then supplied nothing; the vertical axis is
    the share that declined and then supplied material regardless. A model on
    the diagonal fails in both directions equally. The panel separates a model
    whose stated decision is unreliable from one whose delivery is, which four
    separate rates report but none shows at once.

readability_01_coverage:
  label: tab:readability-coverage
  tier: main
  index: false
  kind: table
  caption: >-
    Measurement coverage for the readability measures. The five formula measures are unreliable on a short text, so they are
    computed without a length restriction and treated as missing below a
    fifty-word floor and
    the replies below it carry no reading grade. Removed by Floor is the share
    that loses them. The loss is not random in either direction that matters: it
    is largest on the models that write shortest and on the stratum where
    refusal is most common, so the set of replies on which readability is
    measurable is selected on an outcome the age condition also affects.
    Mean AoA is the mean over tokens matched to the Kuperman norms, and Median
    AoA Coverage reports the share of a reply's words that matched, so a low
    mean cannot be mistaken for a simple vocabulary where it is a thin match
    against the norms.

readability_02_conditioning:
  label: tab:readability-conditioning
  tier: main
  index: false
  kind: table
  caption: >-
    The Flesch-Kincaid grade level of replies at stated minor ages against
    stated adult ages, in grades, paired within scenario. A scenario entered only where the grade level was
    measurable at all eight stated ages, not merely at one age in each block, so
    the denominator is the count complete across the whole ladder. A negative effect means the model writes at a lower grade for a
    user who has stated a minor age. Intervals are percentile bootstrap over
    scenarios with 10,000 draws, the value is a two-sided paired sign-flip
    permutation, and correction is Benjamini and Hochberg within the six tests.

readability_s01_coverage_age:
  label: tab:readability-coverage-age
  tier: supplement
  index: false
  kind: table
  caption: >-
    The share of replies removed by the fifty-word floor at each stated age and in each scenario type. Age trends in measurability differ by model, so the selection does not bias every effect in one direction. Across scenario types it is greatest on Harmful for all six, reaching 40.9 per cent on Gemini 3.5 Flash Lite and 43.8 on Gemma 4 31B, and Benign loss is zero on four models. Measurability declines with the stated age on four of
    the six models and collapses on Harmful scenarios, where one model loses
    more than two fifths of its replies against none of its Benign ones.

readability_s02_levels:
  label: tab:readability-levels
  tier: supplement
  index: false
  kind: table
  caption: >-
    The Flesch-Kincaid grade level at each stated age, over measurable replies and weighted by scenario. The model-level means rise monotonically across all eight stated ages on all six models. That is a statement about the aggregate trajectories and not about every scenario within them.

readability_s03_calibration:
  label: tab:readability-calibration
  tier: supplement
  index: false
  kind: table
  caption: >-
    The primary and secondary measures on the measurable replies that carry a
    target grade, which is the six stated minor ages. AAE is the absolute
    distance between the grade level of a reply and the target grade assigned to the age it was told, and Grade Offset is the same quantity signed, so a positive offset means the model writes above the target: four of the six do and two write below it. Mean AoA is the vocabulary
    axis.

readability_s04_signals:
  label: tab:readability-signals
  tier: supplement
  index: false
  kind: table
  caption: >-
    The Flesch-Kincaid grade level at each level of the age signal, over measurable replies, ordered from no age information through the adult-associated signals to the minor-associated ones. The comparison the primary contrast rests on is between the two
    stated columns; the cue columns say how far an implicit signal moves the
    same measure.

readability_s05_floor:
  label: tab:readability-floor
  tier: supplement
  index: false
  kind: table
  caption: >-
    The primary contrast recomputed at lower word floors. The floor is an
    analysis decision rather than a measurement one, since the measuring pass
    runs at floor zero, so the sensitivity runs downward. A result that holds
    only at fifty words is a result about long replies.

readability_s06_coarse:
  label: tab:readability-coarse
  tier: supplement
  index: false
  kind: table
  caption: >-
    AAE under the continuous target mapping used throughout against the coarse
    step mapping of the source it is taken from, on the four stated ages where
    the two overlap. The continuous extension is this thesis's generalisation
    and the source stops at thirteen, so the check covers ages seven, nine,
    eleven and thirteen and not the full ladder.

readability_s07_correlations:
  label: tab:readability-correlations
  tier: supplement
  index: false
  kind: table
  caption: >-
    Pearson correlation between the fifteen measures over measurable replies.
    The five formula-based measures correlate above 0.85 with one another because they draw on closely related properties of sentence length and word complexity, not because they share an identical definition: FKGL and FRE weigh syllables a word, Gunning Fog counts complex words, ARI counts characters and SMOG counts polysyllables. They are near substitutes in practice rather than by construction, which is why four of the five are demoted and reported here rather than separately. Mean AoA is not independent of them, at .72 against FKGL, but it is related to them through only one of their two inputs: it correlates .86 with word length and .02 with sentence length, so it shares the word-length component of a readability formula and not the sentence-length component. That is what makes it a separate axis to report rather than a sixth formula.

readability_s08_outcome:
  label: tab:readability-outcome
  tier: supplement
  index: false
  kind: table
  caption: >-
    Two sensitivity analyses asking whether the primary contrast is attributable to differences in response-outcome composition, in school grades. The two hold different things fixed: the benign restriction fixes the expected action and the Total Compliance restriction fixes the observed outcome. The word floor removes replies selected on the outcome and
    the outcome moves with the stated age, so the primary contrast could in
    principle report that a model refuses more at young ages and that refusals
    are short, rather than that it writes more simply for a child. Benign scenarios carry the same compliance expectation at every age, so age does not change the benchmark-expected action in this stratum. Models may still refuse benign requests, so the observed response composition is not fixed, and what the restriction removes is the movement in the expected action rather than in the outcome itself. Total Compliance replies hold the
    outcome fixed directly, but they condition on a post-treatment variable, and
    selecting on an outcome the treatment affects can induce a difference where
    none exists, so that restriction is descriptive and carries no test.
    Intervals are percentile bootstrap over scenarios.

readability_s09_boundary:
  label: tab:readability-boundary
  tier: supplement
  index: false
  kind: table
  caption: >-
    Reading grade level at a stated age of seventeen against a stated age of eighteen, in school grades, paired within scenario. The effect is seventeen minus eighteen, so a negative value means the reply is at a lower grade for the seventeen-year-old. The primary contrast
    compares six minor ages against two adult ones and cannot tell a gradual
    climb from a step at the statutory boundary. These two ages are one year
    apart, so an effect here of the same order as the whole ladder would mean
    the reading level is consistent with a discontinuity at the adult boundary,
    and a small one with a gradual climb. Reported as an estimate and an
    interval with no test, since it is a diagnostic and not a declared family. Read against the refusal ladder, where the movement does
    concentrate at this boundary.

readability_s10_lexical_tail:
  label: tab:readability-lexical-tail
  tier: supplement
  index: false
  kind: table
  caption: >-
    Vocabulary measures over all returned replies made at a stated minor age. No fifty-word floor is applied, because these measures do not depend on the formula-based readability threshold and are defined at any length; MTLD is not among them and carries its own minimum.
    Mean AoA is dominated by the common early-acquired words that make up most
    of any reply, so a handful of words well beyond a young reader moves it very
    little; P90 AoA is the ninetieth percentile of the same distribution and
    describes the difficult end of it. Difficult Share uses a fixed threshold of
    ten and is therefore a description of lexical difficulty rather than of
    lexical calibration. AoA Coverage is the share of words matched to the
    Kuperman norms, and is reported alongside the rest so that a low mean is not
    mistaken for a simple vocabulary where it is a thin match against the norms.
    All are descriptive and none carries a test.

safety_s17_stability:
  label: tab:safety-stability
  tier: supplement
  index: false
  kind: table
  caption: >-
    Replicate stability of the thirteen rubric fields. A cell is a model
    crossed with a prompt, three replicates of identical text, and only
    cells with all three returned are counted. Unanimous is the share of
    cells whose three replicates carry the same value. Active Cells
    counts the cells on which the field was recorded at least once, and
    the last column is unanimity among those, which is the figure that
    describes the measurement: a field present on one reply in fifty is
    unanimous on almost every cell for the trivial reason that it is
    absent from all three. Main Response is included so the eleven
    characteristics can be read against the decision they describe.
    Alternative Response counts only the cells whose three replicates
    were all eligible, which is why its denominator is smaller. This is
    descriptive and carries no test; what it establishes is an upper
    bound on how finely a single prevalence in
    Table~\ref{tab:safety-characteristics} can be read.

safety_s18_delivery:
  label: tab:safety-delivery
  tier: supplement
  index: false
  kind: table
  caption: >-
    The three primary contrasts recomputed on Content Delivery Rate beside
    the Refusal Rate effects they mirror, percentage points on Age
    Restricted scenarios, paired within scenario. A negative delivery
    effect means less of the requested material reached the user at the
    younger or more explicit condition, so the two columns should carry
    opposite signs if the age signal changes what arrives rather than
    only how a reply is worded. Descriptive: the confirmatory question
    was fixed on Refusal Rate before the results were seen, so no family
    is declared and no adjusted value is reported.

safety_s19_legal_strata:
  label: tab:safety-legal-strata
  tier: supplement
  index: true
  kind: table
  caption: >-
    Legal Statement separated by scenario type, prevalence in the first
    five columns and the stated minor against stated adult difference in
    the last four. The field records an age-related rule in either
    direction, restricting or granting, so the pooled effect has no
    globally desirable sign and is interpretable only by stratum.
    Descriptive and untested.

safety_s20_conditioned:
  label: tab:safety-conditioned
  tier: supplement
  index: false
  kind: table
  caption: >-
    The stated minor against stated adult contrast recomputed inside a
    single outcome cell, for the seven characteristics that clear the
    agreement floor. The outcome mix moves with age, so a marginal
    effect mixes a change in which cells replies fall into with a change
    in how a cell is written; restricting to one cell separates the two.
    It costs scenarios, which is why the Scenarios column is reported
    and no test is attached.

safety_s21_alternative:
  label: tab:safety-alternative
  tier: supplement
  index: false
  kind: table
  caption: >-
    The two quantities behind the Alternative Response rate. A reply is
    eligible where its answer is a refusal or its delivery is no, and the
    conditional rate is the quantity the rubric defines. Both are given
    because a conditional rate alone can be read backwards: a model can
    appear generous with substitutes because it rarely produces a reply
    on which one is possible.

safety_s22_trend_minors:
  label: tab:safety-trend-minors
  tier: supplement
  index: false
  kind: table
  caption: >-
    The declared rank trend statistic recomputed over the six stated
    minor ages alone, with the full-ladder value beside it. The declared
    test runs over all eight stated ages and so measures association
    across the whole range, taking in the fall at the statutory boundary
    and the fall from eighteen to twenty-one; this is the narrower
    quantity a developmental reading of the ladder needs. Flat counts
    scenarios whose Refusal Rate does not vary across the ages in
    question, and it rises sharply once the adult ages are removed.
    Descriptive: no family is declared, no permutation value is computed
    and nothing here is corrected.

joint_05_matched:
  label: tab:joint-matched
  tier: supplement
  index: true
  caption: >-
    The boundary decomposition of Table~\ref{tab:joint-shape} recomputed on one
    cohort: the Age Restricted scenarios a model has complete at ages seven,
    seventeen, eighteen and twenty-one on refusal and on reading grade level
    alike. It checks that table rather than replacing it: matching breaks the
    comparison twice over. The grade step changes sign on all six models,
    against a negative step there, because within this stratum the share of
    measured replies that are refusals falls from 32.7 per cent at seventeen to
    13.3 at eighteen, and a refusal reads harder than a compliance on every
    model, by 1.4 grades on the panel mean. The boundary movement therefore
    records which kind of text is measured, not how the model writes. The range
    that step is divided by is also only 0.48 grades wide on Gemini 3.5 Flash
    Lite, sending its share of range to minus 301 per cent. Matching further
    costs the refusal panel the scenarios a model refused hardest, whose
    replies are too short to carry a reading measure. The mismatch it removes
    is disclosed in that table's own caption; this is the evidence that
    removing it would be worse.
