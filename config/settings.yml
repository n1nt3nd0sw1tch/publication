    origin: LibrAI/do-not-answer
    split: train
    licence: Apache 2.0

  minorbench:
    name: MinorBench
    kind: hub
    origin: govtech/MinorBench
    split: test
    licence: MIT

  orbench_hard:
    name: OR-Bench Hard
    kind: hub
    origin: bench-llm/or-bench
    config: or-bench-hard-1k
    split: train
    licence: CC BY 4.0

  orbench_toxic:
    name: OR-Bench Toxic
    kind: hub
    origin: bench-llm/or-bench
